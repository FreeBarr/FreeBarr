<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreeBarr</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <div class="login-card">
        <h1 class="app-title">FreeBarr</h1>

        <div style="text-align:center; margin-bottom:1rem;">
            <button id="lang-toggle" onclick="toggleLang()" style="background:none; border:1px solid #888; border-radius:6px; padding:0.25rem 0.75rem; cursor:pointer; font-size:0.85rem;">🌐 ES</button>
        </div>

        <form method="post">
            <div class="form-group">
                <label for="password" class="form-label" data-i18n="login_password_label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
            </div>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-submit" data-i18n="login_btn">
                Sign In
            </button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='translations.js') }}"></script>
</body>
</html>
