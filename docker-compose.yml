version: "3.9"

services:
  freebarr:
    build: .
    container_name: freebarr
    ports:
      - "5000:5000"        # Access at http://localhost:5000
    volumes:
      - ./pos.db:/app/pos.db   # Persist your SQLite database on your host machine
    env_file:
      - .env               # Loads your existing .env config
    restart: unless-stopped